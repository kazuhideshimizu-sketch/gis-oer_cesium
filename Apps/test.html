<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>福井県庁マップ</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    // Cesium ionのトークンが必要な場合はここに追加
     Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4NzI3ZTg5Yi04MWZkLTQ1MmYtOWUxYS1hYmIyNjUzYTJjYmYiLCJpZCI6Mzg1MDE2LCJpYXQiOjE3Njk3MzIyNTV9.cuCVKTgYaac9acsYe8SCRxqgRdqF1Cc1pXxVuWge0rQ';

    var viewer = new Cesium.Viewer('cesiumContainer');

    // KMLの読み込み（ファイルが同じフォルダにある前提）
    viewer.dataSources.add(Cesium.KmlDataSource.load("./echizen_map.kmz"))
      .catch(function(error){
        console.error("KMZの読み込みに失敗しました:", error);
      });

    // 福井県庁のポリゴン作成
    var fukuiPref = viewer.entities.add({
      name: "福井県庁",
      description: "ここは福井県庁です。",
      polygon : {
        hierarchy : Cesium.Cartesian3.fromDegreesArrayHeights([
          136.220266, 36.066095, 0,
          136.220287, 36.063848, 0,
          136.221542, 36.063857, 0,
          136.222444, 36.063978, 0,
          136.222529, 36.064239, 0,
          136.223495, 36.064516, 0,
          136.223238, 36.065704, 0,
          136.223034, 36.065722, 0,
          136.222948, 36.066190, 0,
          136.222315, 36.066138, 0,
          136.221435, 36.066216, 0
        ]),
        extrudedHeight: 333.0,
        material : Cesium.Color.RED.withAlpha(0.5),
        outline : true,
        outlineColor : Cesium.Color.BLACK
      }
    });

    viewer.zoomTo(fukuiPref);
  </script>
</body>
</html>
